<span class="pill-text" [id]="textId"><ng-content /></span>
@if (closable()) {
  <button
    type="button"
    class="pill-close"
    [id]="closeId"
    [attr.aria-label]="closeLabel()"
    [attr.aria-labelledby]="closeId + ' ' + textId"
    (click)="closed.emit()"
  >
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
      <path d="M18 6 6 18M6 6l12 12" />
    </svg>
  </button>
}
